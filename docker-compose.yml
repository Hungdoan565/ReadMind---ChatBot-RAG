version: "3.9"

# RAG Chatbot — Docker Compose
#
# Services:
#   postgres — PostgreSQL + pgvector (port 5432)
#   redis    — Redis cache + rate limiting (port 6379)
#   backend  — FastAPI + LangChain (port 8000)
#   frontend — React via nginx (port 3000)
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in GROQ_API_KEY
#   docker compose up --build
#
# Access:
#   Frontend : http://localhost:3000
#   API docs : http://localhost:8000/docs
#   Health   : http://localhost:8000/api/health

services:
  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readmind
      POSTGRES_PASSWORD: readmind_dev
      POSTGRES_DB: readmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readmind"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Redis — session cache + rate limiting
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------------------------
  # Backend — FastAPI
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override chroma dir to use the mounted volume
      - CHROMA_PERSIST_DIR=/data/chroma
      # CORS — allow frontend service
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:80"]
      # PostgreSQL
      - DATABASE_URL=postgresql+asyncpg://readmind:readmind_dev@postgres:5432/readmind
      - DATABASE_URL_SYNC=postgresql+psycopg://readmind:readmind_dev@postgres:5432/readmind
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_RATE_LIMIT_URL=redis://redis:6379/1
    volumes:
      # Persist ChromaDB data across restarts
      - chroma_data:/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------------------------
  # Frontend — React via nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend build at the backend API
        - VITE_API_URL=http://localhost:8000
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# --------------------------------------------------------------------------
# Volumes
# --------------------------------------------------------------------------
volumes:
  chroma_data:
    driver: local
  pgdata:
    driver: local
  redisdata:
    driver: local

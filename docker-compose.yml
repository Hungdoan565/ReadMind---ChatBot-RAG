version: "3.9"

# RAG Chatbot — Docker Compose
#
# Services:
#   backend  — FastAPI + LangChain + ChromaDB (port 8000)
#   frontend — React via nginx (port 3000)
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in OPENAI_API_KEY
#   docker compose up --build
#
# Access:
#   Frontend : http://localhost:3000
#   API docs : http://localhost:8000/docs
#   Health   : http://localhost:8000/api/health

services:
  # --------------------------------------------------------------------------
  # Backend — FastAPI
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override chroma dir to use the mounted volume
      - CHROMA_PERSIST_DIR=/data/chroma
      # CORS — allow frontend service
      - CORS_ORIGINS=["http://localhost:3000","http://frontend:80"]
    volumes:
      # Persist ChromaDB data across restarts
      - chroma_data:/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------------------------
  # Frontend — React via nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the frontend build at the backend API
        - VITE_API_URL=http://localhost:8000
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# --------------------------------------------------------------------------
# Volumes
# --------------------------------------------------------------------------
volumes:
  chroma_data:
    driver: local
